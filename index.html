<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Game — Lab 01 & 02</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0b0d17;
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #00ffcc;
      font-family: monospace;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 6px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="steps">steps/s: 0</div>
    <div id="frames">frames/s: 0</div>
    <div id="ftime">frame ms: 0</div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <script type="module" src="/client/src/main.js"></script>
</body>
</html>
